name: Build bundled fonts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-fonts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download v1.6 reading fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fontsrc fonts

          # Keep the four v1.5 WOFF2 files already committed.
          # Add four verified reading fonts in their original OpenType/TrueType format.
          curl -fL --retry 3 -o fonts/sourcehanserif.otf "https://raw.githubusercontent.com/adobe-fonts/source-han-serif/release/SubsetOTF/CN/SourceHanSerifCN-Regular.otf"
          curl -fL --retry 3 -o fonts/wenjin.ttf "https://raw.githubusercontent.com/takushun-wu/WenJinMincho/main/ttf/WenJinMinchoP0-Regular.ttf"
          curl -fL --retry 3 -o fonts/qingsong.ttf "https://raw.githubusercontent.com/jasonhandwriting/JasonHandwriting/master/JasonHandwriting1.ttf"
          curl -fL --retry 3 -o /tmp/fontsrc/chilljinshu.zip "https://raw.githubusercontent.com/Warren2060/ChillJinshuSong/main/%E5%AF%92%E8%9D%89%E9%94%A6%E4%B9%A6%E5%AE%8BCC_v1.7/ChillJinshuSongCCRegular.otf.zip"

          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile("/tmp/fontsrc/chilljinshu.zip") as archive:
              candidates = [n for n in archive.namelist() if n.lower().endswith((".otf", ".ttf"))]
              if not candidates:
                  raise SystemExit("No font file found inside ChillJinshuSong archive")
              name = candidates[0]
              Path("fonts/chilljinshu.otf").write_bytes(archive.read(name))
              print("Extracted:", name)
          PY

          sha256sum             fonts/wenkai.woff2             fonts/zhenkai.woff2             fonts/xiaolai.woff2             fonts/yozai.woff2             fonts/sourcehanserif.otf             fonts/chilljinshu.otf             fonts/wenjin.ttf             fonts/qingsong.ttf | sort > fonts/SHA256SUMS.txt

          ls -lh fonts/*.{woff2,otf,ttf} 2>/dev/null || true

      - name: Commit bundled fonts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             fonts/sourcehanserif.otf             fonts/chilljinshu.otf             fonts/wenjin.ttf             fonts/qingsong.ttf             fonts/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No font changes to commit."
          else
            git commit -m "Bundle four additional reading fonts for v1.6 [skip ci]"
            git push
          fi
